name: Deploy Harmoney Pro download page

on:
  push:
    branches: [main]
    paths:
      - 'docs/pro-download/**'
      - '.github/workflows/pro-download-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload download page
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/pro-download
      - name: Deploy download page
        id: deployment
        uses: actions/deploy-pages@v4
