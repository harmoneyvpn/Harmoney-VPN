name: harmoney_vpn_client
description: Public Harmoney VPN client for Android, Windows, and Linux with Harmoney Smart and FireTunnel.
publish_to: none
version: 0.1.1+4037

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  ffi: ^2.1.3
  path_provider: ^2.1.4
  archive: ^4.2.0
  file_picker: ^11.0.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  harmoney_vpn_macos:
    path: ../../packages/harmoney_vpn_macos
  flutter_animate: ^4.5.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.1.0
  lottie: ^3.3.1
  path_drawing: ^1.0.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.1
  installed_apps: ^1.4.0
  disable_battery_optimization: ^1.1.0
  vibration: ^2.0.1
  fl_chart: ^0.69.0
  skeletonizer: ^2.1.3
  smooth_page_indicator: ^1.2.0+3
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  internet_connection_checker_plus: ^2.5.2
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  talker_flutter: ^4.4.1
  encrypt: ^5.0.3
  crypto: ^3.0.6
  http: ^1.2.0
  device_info_plus: ^11.5.0
  mobile_scanner: 6.0.11
  package_info_plus: 9.0.1
  workmanager: 0.10.10
  workmanager_linux: 0.1.1+1
  image: ^4.12.0
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0

dependency_overrides:
  flutter_secure_storage_windows:
    path: packages/flutter_secure_storage_windows
  flutter_local_notifications_windows:
    path: packages/flutter_local_notifications_windows

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/flags/
    - assets/sounds/
    - assets/config/
    - assets/rules/
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 100
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
